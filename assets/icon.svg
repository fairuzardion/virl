<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Virl file icon">
  <defs>
    <linearGradient id="virl-icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="virl-icon-chevron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#virl-icon-bg)"/>

  <!-- Terminal-style chevron ">" -->
  <path d="M 72 74 L 130 128 L 72 182" fill="none" stroke="url(#virl-icon-chevron)"
        stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor underscore -->
  <rect x="150" y="160" width="68" height="22" rx="11" fill="url(#virl-icon-chevron)"/>

  <!-- Small "V" badge, bottom-right, so the icon reads as Virl specifically
       (not just a generic terminal glyph) at a glance in a file browser. -->
  <text x="196" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle"
        opacity="0.92">V</text>
</svg>
