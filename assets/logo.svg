<svg width="560" height="160" viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Virl programming language logo">
  <defs>
    <linearGradient id="virl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="virl-chevron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded square badge with a terminal-style chevron + underscore cursor -->
  <rect x="8" y="8" width="144" height="144" rx="32" fill="url(#virl-bg)"/>
  <path d="M 44 46 L 78 80 L 44 114" fill="none" stroke="url(#virl-chevron)"
        stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="100" width="42" height="14" rx="7" fill="url(#virl-chevron)"/>

  <!-- Wordmark -->
  <text x="184" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="700" fill="#1E1B4B" letter-spacing="1">Virl</text>
  <text x="184" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="500" fill="#64748B" letter-spacing="3">GENERAL-PURPOSE LANGUAGE</text>
</svg>
